# Daily check that the market, news and fundamentals syncs ran recently and
# produced data (from each sync's _meta doc). The job fails when one is stale
# or empty, and GitHub emails the repository owner about failed scheduled runs.
name: Sync health

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -s sync:health
